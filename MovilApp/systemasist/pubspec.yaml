name: systemasist
description: "Credencial de estudiante digital"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # ---------- Dependencias NFC --------
  nfc_manager : ^4.2.1
  ndef_record: ^1.5.0
  app_settings: 8.0.3

  # ---- Seguridad / red -------
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  crypto: ^3.0.6

  # ---- UI / diseño -----
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.jpeg"
  android: true
  ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon/icon.jpeg