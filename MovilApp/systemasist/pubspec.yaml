name: systemasist
description: "Credencial de estudiante digital"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  app_settings: ^9.0.1
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  ndef_record: ^1.5.0
  nfc_manager: ^4.4.0
  qr_flutter: ^4.1.0


  # ---- UI / diseño -----
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.jpeg"
  android: true
  ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon/icon.jpeg
